# Sprint 25 D2 — Scheduled rotation of the Static Web App deployment token.
#
# Calls scripts/azd-ui-token-rotate.sh against dev → staging → production in
# turn. Default cadence: 09:00 UTC on the 1st of every 3rd month (matches the
# Sprint 22 JWT-secret rotation runbook). The rotation script's built-in
# 60-day idempotency gate is the safety net against manual rotations racing
# the cron.
#
# OIDC federation: each GitHub Environment (dev/staging/production) already
# carries the AZURE_CLIENT_ID + AZURE_TENANT_ID + AZURE_SUBSCRIPTION_ID
# variables wired by scripts/azd-cicd-setup.sh. The federated credential
# subject this workflow runs under is
#     repo:9owlsboston/TagPulse:environment:<env>
# so no extra setup is required to land this file.
#
# Cross-repo secret write: the rotation script needs `gh -R 9owlsboston/TagPulse-UI
# secret set --env <env>`. The workflow authenticates with a short-lived
# **GitHub App installation token** (App `tagpulse-ui-secrets`, minted per run
# via actions/create-github-app-token), scoped to the UI repo only — it never
# expires and there is nothing to rotate. Config: the UI_SECRETS_APP_ID repo
# variable + UI_SECRETS_APP_PRIVATE_KEY repo secret (see
# docs/runbooks/rotate-ui-token-github-app.md). The App needs **Secrets:
# read/write** and **Environments: read/write** on the UI repo only — anything
# broader is a blast-radius bug.
# The "Authenticate gh CLI" step is a safety preflight that proves the token
# can both read AND write the target env's secrets *before* the destructive
# Azure-side rotation, so an under-scoped token can never leave the UI repo
# holding a stale (now-invalid) token.

name: rotate-ui-token

on:
  schedule:
    # Quarterly: 09:00 UTC on the 1st of Jan / Apr / Jul / Oct.
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      environments:
        description: 'Comma-separated env list (default: dev). staging/production envs do not exist yet on TagPulse-UI — re-add to the matrix when they land.'
        required: false
        type: string
        default: 'dev'
      force:
        description: 'Bypass the 60-day idempotency gate'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  issues: write  # for the failure-issue fallback

concurrency:
  group: rotate-ui-token
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only `dev` exists on TagPulse-UI today (Settings → Environments).
        # Re-add staging + production here once those environments are
        # created on the UI repo and a SWA has been provisioned for them.
        env: [dev]
    environment: ${{ matrix.env }}
    steps:
      - name: Skip env if not in input list
        id: gate
        run: |
          set -euo pipefail
          REQUESTED="${{ inputs.environments || 'dev' }}"
          if [[ ",${REQUESTED}," == *",${{ matrix.env }},"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping ${{ matrix.env }} (not in REQUESTED='${REQUESTED}')"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5

      - name: Sign in to Azure (OIDC)
        if: steps.gate.outputs.run == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve SWA name from RG
        if: steps.gate.outputs.run == 'true'
        id: swa
        run: |
          set -euo pipefail
          # The cron runner has no persisted azd state; look up the SWA by
          # the C1 'azd-service-name=ui' tag instead. The rotation script
          # accepts AZURE_STATIC_WEB_APPS_NAME + AZURE_RESOURCE_GROUP from
          # the environment when set, bypassing azd entirely.
          SWA_NAME=$(az staticwebapp list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "[?tags.\"azd-service-name\"=='ui'].name | [0]" \
            -o tsv)
          if [[ -z "$SWA_NAME" ]]; then
            echo "::error::No Static Web App tagged azd-service-name=ui in ${{ vars.AZURE_RESOURCE_GROUP }}"
            exit 1
          fi
          echo "swa_name=$SWA_NAME" >> "$GITHUB_OUTPUT"

      - name: Mint cross-repo token (GitHub App)
        id: appauth
        if: steps.gate.outputs.run == 'true' && vars.UI_SECRETS_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.UI_SECRETS_APP_ID }}
          private-key: ${{ secrets.UI_SECRETS_APP_PRIVATE_KEY }}
          owner: ${{ vars.UI_SECRETS_APP_OWNER || '9owlsboston' }}
          repositories: ${{ vars.UI_SECRETS_APP_REPOS || 'TagPulse-UI' }}

      - name: Authenticate gh CLI for cross-repo secret write
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.appauth.outputs.token }}
          UI_REPO: ${{ vars.TAGPULSE_UI_REPO || '9owlsboston/TagPulse-UI' }}
          TARGET_ENV: ${{ matrix.env }}
        run: |
          set -euo pipefail
          # Cross-repo auth uses a short-lived GitHub App installation token
          # (minted per run from the UI_SECRETS_APP_ID variable +
          # UI_SECRETS_APP_PRIVATE_KEY secret — never expires, nothing to
          # rotate). See docs/runbooks/rotate-ui-token-github-app.md for the
          # one-time App setup.
          #
          # This is a *safety preflight*: it must fail BEFORE the destructive
          # `az staticwebapp secrets reset-api-key` in the Rotate step. If the
          # token is missing/expired/under-scoped, surfacing it here avoids the
          # dangerous half-rotated state (Azure token rotated, but the UI repo
          # left holding the now-invalid old token → broken UI deploys).

          # 1. Missing/empty token — the App isn't configured.
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::No cross-repo token minted. Set the UI_SECRETS_APP_ID" \
                 "repo variable + UI_SECRETS_APP_PRIVATE_KEY repo secret (GitHub" \
                 "App 'tagpulse-ui-secrets', scoped to ${UI_REPO}). See" \
                 "docs/runbooks/rotate-ui-token-github-app.md."
            exit 1
          fi

          # 2. Token validity.
          if ! gh auth status; then
            echo "::error::Cross-repo App token is invalid. Confirm the GitHub" \
                 "App is still installed on ${UI_REPO} and UI_SECRETS_APP_PRIVATE_KEY" \
                 "matches UI_SECRETS_APP_ID."
            exit 1
          fi

          # 3. Reachability — confirm the token can read the environment's
          #    secrets public key and that the environment exists at all. This
          #    is necessary but NOT sufficient: a read-only check passes even
          #    when writes are forbidden, so step 4 proves write separately.
          if ! gh api "repos/${UI_REPO}/environments/${TARGET_ENV}/secrets/public-key" \
                 --silent 2>/tmp/ghapi.err; then
            echo "::error::Cross-repo token cannot read env '${TARGET_ENV}'" \
                 "secrets on ${UI_REPO}. Confirm the '${TARGET_ENV}' environment" \
                 "exists there and the token can read it."
            sed 's/^/  gh api: /' /tmp/ghapi.err >&2 || true
            exit 1
          fi

          # 4. Write capability — the real test. Environment-secret *writes*
          #    are gated by the **Environments: write** permission, which is
          #    NOT implied by Secrets: write; the read in step 3 succeeds even
          #    when the write 403s ("Resource not accessible by integration").
          #    Prove write by setting + deleting a throwaway probe secret
          #    BEFORE the destructive `az ... reset-api-key`, so an under-scoped
          #    token fails here instead of leaving the UI repo half-rotated
          #    (Azure key reset, but the new value never written back).
          #    Use a run-scoped probe name so it can never collide with / clobber
          #    a real secret, and arm an EXIT trap so a crash mid-step still
          #    cleans it up.
          PROBE="ROTATE_PREFLIGHT_PROBE_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          # NB: no `--body`; gh reads the value from stdin only when --body is
          # omitted (`--body -` would store the literal string "-").
          if ! printf 'preflight-delete-me' | gh -R "${UI_REPO}" secret set \
                 "${PROBE}" --env "${TARGET_ENV}" 2>/tmp/ghprobe.err; then
            echo "::error::Cross-repo token can READ but cannot WRITE env" \
                 "'${TARGET_ENV}' secrets on ${UI_REPO}. Environment-secret" \
                 "writes need **Environments: write** — for the GitHub App, set" \
                 "Repository permissions → Environments → Read and write and" \
                 "approve it on the installation; for a PAT, grant Secrets: write."
            sed 's/^/  gh secret set: /' /tmp/ghprobe.err >&2 || true
            exit 1
          fi
          trap 'gh -R "${UI_REPO}" secret delete "${PROBE}" --env "${TARGET_ENV}" >/dev/null 2>&1 || true' EXIT
          # Remove the probe so it never lingers in the UI repo environment.
          if ! gh -R "${UI_REPO}" secret delete "${PROBE}" --env "${TARGET_ENV}" 2>/dev/null; then
            echo "::warning::preflight probe secret ${PROBE} was written to" \
                 "${UI_REPO} env=${TARGET_ENV} but could not be deleted; remove it manually."
          fi
          trap - EXIT
          echo "✓ token validated for ${UI_REPO} env=${TARGET_ENV} secret writes (read + write)"

      - name: Rotate token
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.appauth.outputs.token }}
          TAGPULSE_UI_REPO: ${{ vars.TAGPULSE_UI_REPO || '9owlsboston/TagPulse-UI' }}
          AZURE_STATIC_WEB_APPS_NAME: ${{ steps.swa.outputs.swa_name }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          ARGS=("${{ matrix.env }}")
          if [[ "${{ inputs.force }}" == "true" ]]; then
            ARGS+=(--force)
          fi
          scripts/azd-ui-token-rotate.sh "${ARGS[@]}"

      - name: Open issue on failure
        if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const env = '${{ matrix.env }}';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const title = `rotate-ui-token failed for env=${env}`;
            const body = [
              `The scheduled SWA-token rotation for **${env}** failed.`,
              ``,
              `Run: ${runUrl}`,
              ``,
              `Likely causes (the "Authenticate gh CLI" preflight pinpoints the token ones):`,
              `- The GitHub App token couldn't be minted — confirm the \`UI_SECRETS_APP_ID\` variable + \`UI_SECRETS_APP_PRIVATE_KEY\` secret are set and the App \`tagpulse-ui-secrets\` is still installed on \`9owlsboston/TagPulse-UI\`.`,
              `- The App is under-scoped or the \`${env}\` environment is missing on the UI repo — the App needs **Secrets: read/write** + **Environments: read/write** and the environment must exist.`,
              `- \`AZURE_RESOURCE_GROUP\` variable on the \`${env}\` Environment is wrong or the SWA was renamed.`,
              `- The OIDC federated credential is no longer trusted (re-run \`scripts/azd-cicd-setup.sh ${env}\`).`,
              ``,
              `Manual recovery: \`scripts/azd-ui-token-rotate.sh ${env} --force\` from a workstation that's signed in to the right tenant.`,
            ].join('\n');
            // Idempotent: reuse an existing open issue (the quarterly cron
            // would otherwise file a fresh duplicate on every failed run).
            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
            });
            const hit = existing.data.items.find((i) => i.title === title);
            if (hit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: hit.number,
                body: `Rotation failed again — ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ops', 'security'],
              });
            }
