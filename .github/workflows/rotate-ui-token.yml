# Sprint 25 D2 — Scheduled rotation of the Static Web App deployment token.
#
# Calls scripts/azd-ui-token-rotate.sh against dev → staging → production in
# turn. Default cadence: 09:00 UTC on the 1st of every 3rd month (matches the
# Sprint 22 JWT-secret rotation runbook). The rotation script's built-in
# 60-day idempotency gate is the safety net against manual rotations racing
# the cron.
#
# OIDC federation: each GitHub Environment (dev/staging/production) already
# carries the AZURE_CLIENT_ID + AZURE_TENANT_ID + AZURE_SUBSCRIPTION_ID
# variables wired by scripts/azd-cicd-setup.sh. The federated credential
# subject this workflow runs under is
#     repo:9owlsboston/TagPulse:environment:<env>
# so no extra setup is required to land this file.
#
# Cross-repo secret write: the rotation script needs `gh -R 9owlsboston/TagPulse-UI
# secret set --env <env>`. The workflow uses a fine-scoped PAT
# (UI_REPO_SECRETS_PAT) stored as a *repository* secret here; rotate it
# alongside the SWA tokens (the script's audit log surfaces last-4-chars).
# Scope: fine-grained PAT with **Secrets: read/write** on the UI repo only
# (classic equivalent: `repo`) — anything broader is a blast-radius bug.
# A PAT expiry is the most common failure mode: the "Authenticate gh CLI"
# step is a safety preflight that fails *before* the destructive Azure-side
# rotation so an expired/under-scoped PAT can never leave the UI repo
# holding a stale (now-invalid) token.

name: rotate-ui-token

on:
  schedule:
    # Quarterly: 09:00 UTC on the 1st of Jan / Apr / Jul / Oct.
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      environments:
        description: 'Comma-separated env list (default: dev). staging/production envs do not exist yet on TagPulse-UI — re-add to the matrix when they land.'
        required: false
        type: string
        default: 'dev'
      force:
        description: 'Bypass the 60-day idempotency gate'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  issues: write  # for the failure-issue fallback

concurrency:
  group: rotate-ui-token
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only `dev` exists on TagPulse-UI today (Settings → Environments).
        # Re-add staging + production here once those environments are
        # created on the UI repo and a SWA has been provisioned for them.
        env: [dev]
    environment: ${{ matrix.env }}
    steps:
      - name: Skip env if not in input list
        id: gate
        run: |
          set -euo pipefail
          REQUESTED="${{ inputs.environments || 'dev' }}"
          if [[ ",${REQUESTED}," == *",${{ matrix.env }},"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping ${{ matrix.env }} (not in REQUESTED='${REQUESTED}')"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5

      - name: Sign in to Azure (OIDC)
        if: steps.gate.outputs.run == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve SWA name from RG
        if: steps.gate.outputs.run == 'true'
        id: swa
        run: |
          set -euo pipefail
          # The cron runner has no persisted azd state; look up the SWA by
          # the C1 'azd-service-name=ui' tag instead. The rotation script
          # accepts AZURE_STATIC_WEB_APPS_NAME + AZURE_RESOURCE_GROUP from
          # the environment when set, bypassing azd entirely.
          SWA_NAME=$(az staticwebapp list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "[?tags.\"azd-service-name\"=='ui'].name | [0]" \
            -o tsv)
          if [[ -z "$SWA_NAME" ]]; then
            echo "::error::No Static Web App tagged azd-service-name=ui in ${{ vars.AZURE_RESOURCE_GROUP }}"
            exit 1
          fi
          echo "swa_name=$SWA_NAME" >> "$GITHUB_OUTPUT"

      - name: Mint cross-repo token (GitHub App → PAT fallback)
        id: appauth
        if: steps.gate.outputs.run == 'true' && vars.UI_SECRETS_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.UI_SECRETS_APP_ID }}
          private-key: ${{ secrets.UI_SECRETS_APP_PRIVATE_KEY }}
          owner: ${{ vars.UI_SECRETS_APP_OWNER || '9owlsboston' }}
          repositories: ${{ vars.UI_SECRETS_APP_REPOS || 'TagPulse-UI' }}

      - name: Authenticate gh CLI for cross-repo secret write
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.appauth.outputs.token || secrets.UI_REPO_SECRETS_PAT }}
          UI_REPO: ${{ vars.TAGPULSE_UI_REPO || '9owlsboston/TagPulse-UI' }}
          TARGET_ENV: ${{ matrix.env }}
        run: |
          set -euo pipefail
          # Cross-repo auth. When the UI_SECRETS_APP_ID repo variable is set,
          # GH_TOKEN is a short-lived GitHub App installation token (never
          # expires — minted per run); otherwise it falls back to the
          # UI_REPO_SECRETS_PAT fine-scoped PAT (secrets:write on the UI repo).
          # See docs/runbooks/rotate-ui-token-github-app.md for the one-time
          # App setup that retires the PAT entirely.
          #
          # This is a *safety preflight*: it must fail BEFORE the destructive
          # `az staticwebapp secrets reset-api-key` in the Rotate step. If the
          # token is missing/expired/under-scoped, surfacing it here avoids the
          # dangerous half-rotated state (Azure token rotated, but the UI repo
          # left holding the now-invalid old token → broken UI deploys).

          # 1. Missing/empty secret — distinct, actionable error.
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::No cross-repo token available. Either set the" \
                 "UI_SECRETS_APP_ID variable + UI_SECRETS_APP_PRIVATE_KEY" \
                 "secret (GitHub App — preferred), or store a fine-scoped PAT" \
                 "(secrets:write on ${UI_REPO}) as the UI_REPO_SECRETS_PAT secret."
            exit 1
          fi

          # 2. Token validity.
          if ! gh auth status; then
            echo "::error::Cross-repo token is invalid or expired. If using a" \
                 "PAT, rotate UI_REPO_SECRETS_PAT (secrets:write on ${UI_REPO});" \
                 "if using the GitHub App, confirm the App is still installed."
            exit 1
          fi

          # 3. Authorization — verify the token can reach the EXACT capability
          #    the Rotate step needs: reading the environment's secrets public
          #    key (the endpoint `gh secret set --env` uses). An under-scoped
          #    token, or a missing environment, fails here instead of after the
          #    Azure-side rotation.
          if ! gh api "repos/${UI_REPO}/environments/${TARGET_ENV}/secrets/public-key" \
                 --silent 2>/tmp/ghapi.err; then
            echo "::error::Cross-repo token cannot access env '${TARGET_ENV}'" \
                 "secrets on ${UI_REPO}. Confirm it grants secrets:write on" \
                 "${UI_REPO} and that the '${TARGET_ENV}' environment exists there."
            sed 's/^/  gh api: /' /tmp/ghapi.err >&2 || true
            exit 1
          fi
          echo "✓ token validated for ${UI_REPO} env=${TARGET_ENV} secret writes"

      - name: Rotate token
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.appauth.outputs.token || secrets.UI_REPO_SECRETS_PAT }}
          TAGPULSE_UI_REPO: ${{ vars.TAGPULSE_UI_REPO || '9owlsboston/TagPulse-UI' }}
          AZURE_STATIC_WEB_APPS_NAME: ${{ steps.swa.outputs.swa_name }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          ARGS=("${{ matrix.env }}")
          if [[ "${{ inputs.force }}" == "true" ]]; then
            ARGS+=(--force)
          fi
          scripts/azd-ui-token-rotate.sh "${ARGS[@]}"

      - name: Open issue on failure
        if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const env = '${{ matrix.env }}';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const title = `rotate-ui-token failed for env=${env}`;
            const body = [
              `The scheduled SWA-token rotation for **${env}** failed.`,
              ``,
              `Run: ${runUrl}`,
              ``,
              `Likely causes (the "Authenticate gh CLI" preflight pinpoints the first two):`,
              `- \`UI_REPO_SECRETS_PAT\` expired/invalid — rotate it: create a new fine-scoped PAT with **Secrets: read/write** on \`9owlsboston/TagPulse-UI\` and update the \`UI_REPO_SECRETS_PAT\` repo secret.`,
              `- \`UI_REPO_SECRETS_PAT\` under-scoped or the \`${env}\` environment is missing on the UI repo — the PAT needs **Secrets: write** and the environment must exist.`,
              `- \`AZURE_RESOURCE_GROUP\` variable on the \`${env}\` Environment is wrong or the SWA was renamed.`,
              `- The OIDC federated credential is no longer trusted (re-run \`scripts/azd-cicd-setup.sh ${env}\`).`,
              ``,
              `Manual recovery: \`scripts/azd-ui-token-rotate.sh ${env} --force\` from a workstation that's signed in to the right tenant.`,
            ].join('\n');
            // Idempotent: reuse an existing open issue (the quarterly cron
            // would otherwise file a fresh duplicate on every failed run).
            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
            });
            const hit = existing.data.items.find((i) => i.title === title);
            if (hit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: hit.number,
                body: `Rotation failed again — ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ops', 'security'],
              });
            }
